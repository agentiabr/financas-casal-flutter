name: financas_casal_flutter
description: "Aplicativo de Finanças do Casal • Rodrigo & Márcia (Flutter + Supabase)"
publish_to: 'none'
version: 1.9.7+64

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend & Realtime
  supabase_flutter: ^2.8.0

  # Reconhecimento e Síntese de Voz Nativa (Hardware do Celular)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

  # Câmera e OCR de Cupom Fiscal com Inteligência Artificial On-Device
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2

  # UI & Design System Flat
  intl: ^0.19.0
  lucide_icons_flutter: ^3.1.24
  fl_chart: ^0.70.0
  google_fonts: ^6.2.1

  # Gerenciamento de Estado e Armazenamento Local / Offline
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  # Autenticação Biométrica e Face ID
  local_auth: ^2.3.0
  # Engine de Alta Fidelidade do Dashboard
  webview_flutter: ^4.14.1
  # Abrir lojas, WhatsApp e sites externos fora do WebView
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
