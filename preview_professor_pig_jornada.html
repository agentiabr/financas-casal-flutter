<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ControlPig • Jornada do Professor Pig (Fundo Embaçado & Guia por Seção)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Animação suave e contínua de flutuação do Piggy */
    @keyframes piggyFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-10px) scale(1.015);
      }
    }

    /* Brilho neon cyan no balão futurista */
    @keyframes neonGlow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.45), 0 0 50px rgba(6, 182, 212, 0.15), inset 0 0 15px rgba(6, 182, 212, 0.2);
        border-color: rgba(34, 211, 238, 0.85);
      }
      50% {
        box-shadow: 0 0 35px rgba(6, 182, 212, 0.7), 0 0 70px rgba(6, 182, 212, 0.3), inset 0 0 25px rgba(6, 182, 212, 0.35);
        border-color: #38bdf8;
      }
    }

    .animate-piggy {
      animation: piggyFloat 4.2s ease-in-out infinite;
    }

    .neon-speech-bubble {
      animation: neonGlow 3.5s ease-in-out infinite;
      background: linear-gradient(145deg, rgba(14, 116, 144, 0.45) 0%, rgba(15, 23, 42, 0.75) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Bico do balão holográfico neon */
    .bubble-pointer {
      position: absolute;
      bottom: -15px;
      right: 56px;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 16px solid #22d3ee;
      filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.9));
    }
    .bubble-pointer::after {
      content: '';
      position: absolute;
      top: -18px;
      left: -12px;
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 15px solid #0f172a;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-0 sm:p-4 select-none overflow-x-hidden">

  <!-- DISPOSITIVO SMARTPHONE / TELA CHEIA -->
  <div class="relative w-full max-w-[430px] h-screen sm:h-[880px] sm:max-h-[96vh] sm:rounded-[44px] shadow-[0_25px_80px_rgba(0,0,0,0.95)] border-0 sm:border-[8px] sm:border-slate-800 overflow-hidden flex flex-col justify-between">
    
    <!-- ============================================================== -->
    <!-- CAMADA 1: O APLICATIVO REAL EM SEGUNDO PLANO (EMBAÇADO COM BLUR) -->
    <!-- ============================================================== -->
    <div class="absolute inset-0 z-0 overflow-hidden select-none pointer-events-none transition-all duration-700" id="blurredAppBackground">
      
      <!-- CABEÇALHO DO APP (RODRIGO & MÁRCIA) -->
      <div class="px-4 py-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-base">👨</span>
          <span class="font-black text-xs text-white">Rodrigo</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="px-2 py-0.5 rounded-lg bg-sky-950 text-sky-300 font-extrabold text-[10px] border border-sky-800">Admin</span>
          <span class="px-2 py-0.5 rounded-lg bg-red-950 text-red-300 font-extrabold text-[10px]">Sair</span>
        </div>
      </div>

      <!-- CONTEÚDO DO APP DEPENDENDO DA SEÇÃO -->
      <div class="p-4 space-y-3.5" id="mockScreenContent">
        <!-- Injetado dinamicamente via JS -->
      </div>

      <!-- MÁSCARA ESCURECEDORA DE DESTAQUE COM BLUR PROFUNDO -->
      <div class="absolute inset-0 bg-slate-950/75 backdrop-blur-xl z-10"></div>
    </div>

    <!-- ============================================================== -->
    <!-- CAMADA 2: CONTROLE DO PROTÓTIPO (SELETOR DISCRETO NO TOPO)     -->
    <!-- Permite alternar entre Entrada/Tabela, Remédios e Mercado       -->
    <!-- ============================================================== -->
    <div class="relative z-30 pt-4 px-4 flex items-center justify-between">
      <div class="flex items-center gap-1 p-1 rounded-2xl bg-black/40 backdrop-blur-md border border-white/10">
        <button onclick="switchSection('tabela')" id="tabBtn-tabela" class="px-2.5 py-1.5 rounded-xl text-[11px] font-black bg-cyan-400 text-slate-950 shadow-md transition-all cursor-pointer">
          📊 1. Entrada / Tabela
        </button>
        <button onclick="switchSection('remedios')" id="tabBtn-remedios" class="px-2.5 py-1.5 rounded-xl text-[11px] font-extrabold text-slate-300 hover:text-white transition-all cursor-pointer">
          💊 2. Remédios
        </button>
        <button onclick="switchSection('mercado')" id="tabBtn-mercado" class="px-2.5 py-1.5 rounded-xl text-[11px] font-extrabold text-slate-300 hover:text-white transition-all cursor-pointer">
          🛒 3. Mercado
        </button>
      </div>

      <!-- Botão Fechar / Dispensar Discreto -->
      <button onclick="dismissScreen()" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 active:scale-90 text-white flex items-center justify-center backdrop-blur-md border border-white/20 transition-all cursor-pointer" title="Entrar na seção">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- ============================================================== -->
    <!-- CAMADA 3: O PROFESSOR PIG NA FRENTE COM BALÃO HOLOGRÁFICO       -->
    <!-- ============================================================== -->
    <main class="relative z-20 flex-1 flex flex-col justify-between px-5 pt-3 pb-0 overflow-hidden">

      <!-- BALÃO DE FALA MODERNO & CLEAN EM NEON CYAN -->
      <div class="relative z-30 mt-auto mb-2 transition-all duration-300" id="bubbleContainer">
        <div class="neon-speech-bubble rounded-3xl p-5 border-2 border-cyan-400 text-left relative shadow-2xl">
          
          <!-- Cabeçalho do Balão com Áudio -->
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="text-xl" id="bubbleIcon">💡</span>
              <h3 class="font-black text-sm sm:text-base text-cyan-200 tracking-tight" id="bubbleTitle">
                A Tabela é o Cérebro do App
              </h3>
            </div>
            
            <button onclick="speakCurrentTip()" class="p-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-cyan-300 transition-all cursor-pointer" title="Ouvir explicação em voz">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>
          </div>

          <!-- Mensagem Didática e Clara -->
          <p class="text-xs sm:text-[13px] font-semibold text-slate-100 leading-relaxed min-h-[72px]" id="bubbleMessage">
            Olá, Rodrigo e Márcia! Esta tabela é o coração de tudo. Cada salário, conta de água, luz ou supermercado lançado aqui alimenta seu saldo positivo, calcula o fechamento dos seus cartões e garante que o cofrinho cresça todo mês!
          </p>

          <!-- Bico do balão apontando para o dedo do Professor Pig -->
          <div class="bubble-pointer"></div>
        </div>
      </div>

      <!-- O MASCOTE PROFESSOR PIG EM DESTAQUE NA FRENTE -->
      <div class="relative z-10 w-full flex items-end justify-center -mb-2 mt-auto animate-piggy">
        <!-- Holofote de luz sutil atrás do Piggy -->
        <div class="absolute bottom-6 w-56 h-12 bg-cyan-500/25 rounded-full blur-2xl"></div>

  <!-- LÓGICA DE TRANSIÇÃO ENTRE AS SEÇÕES -->

    const sections = {
      tabela: {
        title: "A Tabela é o Cérebro do App",
        icon: "🧠",
        message: "Olá, Rodrigo e Márcia! Esta tabela é o coração de tudo. Cada salário, aluguel ou gasto no mercado lançado aqui alimenta seu saldo positivo real, prevê o fechamento das faturas e faz os cofrinhos crescerem no piloto automático!",
        actionText: "Ver Minha Tabela",
        mockHtml: `
          <!-- CARD SALDO AZUL -->
          <div class="p-4 rounded-2xl bg-blue-600 text-white shadow-lg space-y-1">
            <span class="text-[10px] font-bold uppercase tracking-wider text-blue-200">Saldo Positivo Livre</span>
            <div class="text-2xl font-black">R$ 4.250,00</div>
          </div>
          <!-- TABELA MOCK -->
          <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3 space-y-2">
            <div class="flex justify-between text-[11px] font-extrabold text-slate-400 border-b border-slate-800 pb-1.5">
              <span>DESCRIÇÃO</span>
              <span>VALOR</span>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-white">💰 Salário Rodrigo</span>
              <span class="font-mono font-black text-emerald-400">+ R$ 5.200,00</span>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-white">🛒 Supermercado Dia</span>
              <span class="font-mono font-black text-rose-400">- R$ 412,50</span>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-white">💊 Farmácia Panvel</span>
              <span class="font-mono font-black text-rose-400">- R$ 138,90</span>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-white">💡 Conta de Luz</span>
              <span class="font-mono font-black text-rose-400">- R$ 185,20</span>
            </div>
          </div>
        `
      },
      remedios: {
        title: "Sua Rotina de Saúde & Medicamentos",
        icon: "💊",
        message: "Nesta seção você tem controle total da sua saúde diária! Cadastre seus remédios de uso contínuo, receba avisos com voz na hora exata da dose, controle a cartela para nunca faltar e compare o menor preço nas 10 maiores farmácias.",
        actionText: "Acessar Meus Remédios",
        mockHtml: `
          <!-- ROTINA DA MANHÃ -->
          <div class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5 font-black text-xs text-white">
                <span>☀️</span> <span>Dose da Manhã (08:00)</span>
              </div>
              <span class="px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 font-extrabold text-[10px]">Já Tomou</span>
            </div>
            <div class="p-2 rounded-xl bg-slate-850 border border-slate-800 text-[11px] flex justify-between">
              <span class="text-slate-200">Aradois 50mg (Losartana)</span>
              <span class="font-bold text-slate-400">Restam 18 comp.</span>
            </div>
          </div>

          <!-- ROTINA DA NOITE -->
          <div class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5 font-black text-xs text-white">
                <span>🌙</span> <span>Dose da Noite (20:00)</span>
              </div>
              <span class="px-2 py-0.5 rounded-full bg-amber-950 text-amber-400 font-extrabold text-[10px]">Pendente</span>
            </div>
            <div class="p-2 rounded-xl bg-slate-850 border border-slate-800 text-[11px] flex justify-between">
              <span class="text-slate-200">Glifage XR 500mg</span>
              <span class="font-bold text-slate-400">Restam 24 comp.</span>
            </div>
          </div>
        `
      },
      mercado: {
        title: "Leitura de Nota Fiscal por QR Code",
        icon: "🛒",
        message: "Adeus anotações manuais! Ao fazer compras no mercado, basta apontar a câmera para o QR Code da nota fiscal. Cada produto, preço e quantidade entra automaticamente no histórico para você comparar qual mercado vendeu mais barato!",
        actionText: "Escanear Nota Fiscal",
        mockHtml: `
          <!-- MOCK COMPARADOR -->
          <div class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="font-black text-xs text-white">⚡ Histórico de Preços da Família</span>
              <span class="text-[10px] text-sky-400 font-bold">142 itens lidos</span>
            </div>
            <div class="space-y-1.5 text-[11px]">
              <div class="p-2 rounded-xl bg-slate-850 flex justify-between">
                <span>🥛 Leite Desnatado 1L</span>
                <span class="font-black text-emerald-400">Dia: R$ 4,69 (Melhor)</span>
              </div>
              <div class="p-2 rounded-xl bg-slate-850 flex justify-between">
                <span>🍗 Peito de Frango 1kg</span>
                <span class="font-black text-emerald-400">Assaí: R$ 17,90 (Melhor)</span>
              </div>
              <div class="p-2 rounded-xl bg-slate-850 flex justify-between">
                <span>☕ Café Pilão 500g</span>
                <span class="font-black text-slate-300">Carrefour: R$ 19,80</span>
              </div>
            </div>
          </div>
        `
      }
    };

    let currentSec = 'tabela';

    function switchSection(sec) {
      currentSec = sec;
      const data = sections[sec];

      // Atualizar botões de demonstração
      ['tabela', 'remedios', 'mercado'].forEach(s => {
        const btn = document.getElementById(`tabBtn-${s}`);
        if (s === sec) {
          btn.className = "px-2.5 py-1.5 rounded-xl text-[11px] font-black bg-cyan-400 text-slate-950 shadow-md transition-all cursor-pointer";
        } else {
          btn.className = "px-2.5 py-1.5 rounded-xl text-[11px] font-extrabold text-slate-300 hover:text-white transition-all cursor-pointer";
        }
      });

      // Atualizar fundo embaçado
      document.getElementById('mockScreenContent').innerHTML = data.mockHtml;

      // Atualizar balão com transição
      const titleEl = document.getElementById('bubbleTitle');
      const iconEl = document.getElementById('bubbleIcon');
      const msgEl = document.getElementById('bubbleMessage');
      const actEl = document.getElementById('btnActionText');

      msgEl.style.opacity = '0';
      setTimeout(() => {
        titleEl.textContent = data.title;
        iconEl.textContent = data.icon;
        msgEl.textContent = data.message;
        actEl.textContent = data.actionText;
        msgEl.style.opacity = '1';
      }, 120);
    }

    function proceedNext() {
      if (currentSec === 'tabela') switchSection('remedios');
      else if (currentSec === 'remedios') switchSection('mercado');
      else switchSection('tabela');
    }

    function speakCurrentTip() {
      const data = sections[currentSec];
      const speech = `${data.title}. ${data.message}`;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(speech);
        utter.lang = 'pt-BR';
        utter.rate = 1.05;
        utter.pitch = 1.1;
        window.speechSynthesis.speak(utter);
      }
    }

    function dismissScreen() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      alert(`Aqui a tela do Professor Pig se despediria com animação suave de desfoque, abrindo a tela limpa da seção ${currentSec.toUpperCase()}!`);
    }

    // Inicialização
    switchSection('tabela');
  </script>
