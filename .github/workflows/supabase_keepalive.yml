name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: '0 9 */3 * *'   # A cada 3 dias às 09:00 UTC (evita hibernação de 7 dias do plano Free)
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/supabase_keepalive.yml'

permissions:
  contents: read

jobs:
  ping:
    name: Manter Supabase ativo (Keep-Alive)
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Auth e Banco (PostgREST) no Supabase
        run: |
          set -euo pipefail
          SUPABASE_URL="https://ipwgvwmuhcfrdjkzzzdv.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlwd2d2d211aGNmcmRqa3p6emR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MTYyMTcsImV4cCI6MjEwNzA5MjIxN30._X2iTDoaiwMBz8MU9MrFfOxYAn-JWkSrsegwj8Lts2k"

          echo "1) Verificando Auth Health & Settings..."
          curl -sS -f "$SUPABASE_URL/auth/v1/health" -H "apikey: $ANON_KEY"
          echo ""
          curl -sS -f "$SUPABASE_URL/auth/v1/settings" -H "apikey: $ANON_KEY" > /dev/null

          echo "2) Executando query PostgREST no PostgreSQL para registrar atividade..."
          HTTP_CODE=$(curl -sS -o /tmp/rest_out.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/user_roles?select=user_id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "PostgREST user_roles HTTP: $HTTP_CODE"
          echo "Keep-alive concluído com sucesso em $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
