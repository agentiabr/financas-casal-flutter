name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite disparar a compilação manualmente com 1 clique no GitHub

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter SDK (Versão Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências Flutter
        run: flutter pub get

      - name: Compilar APKs Otimizados (Leves para Celular)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Disponibilizar APKs para Download
        uses: actions/upload-artifact@v4
        with:
          name: financas-casal-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
